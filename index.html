<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Game Studio Tycoon Türkiye - Tam Sürüm</title>
  <style>
    :root{--bg:#0b1020;--bg2:#131a2f;--panel:#1b2540;--panel2:#25345d;--txt:#eff4ff;--muted:#9fb1d1;--accent:#52a5ff;--good:#47d38b;--warn:#ffcb57;--bad:#ff6a78}
    *{box-sizing:border-box} body{margin:0;color:var(--txt);font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 20% 20%,#1a2445, var(--bg));}
    .screen{display:none;min-height:100vh}.active{display:block}
    .hero{max-width:980px;margin:8vh auto;background:linear-gradient(180deg,#1a2546,#131a31);border:1px solid #334770;border-radius:18px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    .hero h1{margin:0 0 8px;font-size:34px}.hero p{color:var(--muted)}
    .menu{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:10px;margin-top:16px}
    button,input,select{border:1px solid #3a4a75;background:var(--panel2);color:var(--txt);padding:10px 12px;border-radius:10px}
    button:hover{border-color:var(--accent);cursor:pointer}
    .topbar{position:sticky;top:0;z-index:4;background:#0f162abf;backdrop-filter:blur(7px);display:grid;grid-template-columns:1.1fr auto 1.3fr;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #2f4068}
    .speed{display:flex;gap:6px}.speed button.active{border-color:var(--good)}
    .strip{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.pill{font-size:12px;background:#1b2845;border:1px solid #334870;padding:6px 9px;border-radius:999px}
    .layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 120px)}
    aside{background:#0f162a;border-right:1px solid #2f4068;padding:10px}.tab{display:block;width:100%;text-align:left;margin-bottom:8px}.tab.active{background:#1f315a;border-color:var(--accent)}
    main{padding:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
    .card{background:linear-gradient(180deg,#1c2948,#161f37);border:1px solid #33476f;border-radius:12px;padding:12px}
    .card h3,.card h4{margin:0 0 8px}.small{font-size:12px;color:var(--muted)}
    table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #324665;padding:7px;text-align:left;font-size:14px}
    .notif{background:#1f2c49;border:1px solid #32517f;border-left:4px solid var(--accent);padding:8px;border-radius:8px;margin-bottom:8px}
    .rows{display:flex;gap:7px;flex-wrap:wrap}.kpi{font-size:24px;font-weight:700}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#2f4675;font-size:12px;margin-right:5px}
    footer{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #2f4068;background:#0f162a;padding:10px}
    .modal-bg{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:5}.modal{width:min(920px,96vw);max-height:92vh;overflow:auto;background:#17213c;border:1px solid #3a4f79;border-radius:14px;padding:14px}
    .f{display:grid;gap:4px;margin-bottom:8px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    canvas{width:100%;height:160px;background:#10192e;border:1px solid #304468;border-radius:8px}
    @media (max-width:980px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;gap:8px}.tab{min-width:190px}.topbar{grid-template-columns:1fr}.menu{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="start" class="screen active">
  <div class="hero">
    <h1>AI Game Studio Tycoon Türkiye</h1>
    <p>Aras Demir ile ev ofisten global oyun şirketine. Bu sürüm tamamen tarayıcıda ve tek HTML dosyasında çalışır.</p>
    <div class="menu">
      <button id="newBtn">Yeni Kariyer</button>
      <button id="loadBtn">Kaydı Yükle</button>
      <button onclick="info('how')">Nasıl Oynanır</button>
      <button onclick="info('about')">Hakkında</button>
    </div>
  </div>
</div>
<div id="game" class="screen">
  <header class="topbar">
    <div><h2 id="company">-</h2><div class="small" id="date">-</div></div>
    <div class="speed">
      <button data-sp="0">Duraklat</button><button data-sp="1" class="active">1x</button><button data-sp="2">2x</button><button data-sp="4">4x</button>
    </div>
    <div class="strip" id="strip"></div>
  </header>
  <div class="layout">
    <aside id="side"></aside>
    <main id="main"></main>
  </div>
  <footer><button id="save">Manuel Kaydet</button><button id="reset">Yeni Oyun</button></footer>
</div>
<div id="modal"></div>
<script>
const KEY='aiGameStudioTycoonTR_html_v2';
const TABS=[['dashboard','Ana Dashboard'],['new','Yeni Oyun Oluştur'],['projects','Aktif Projeler'],['games','Yayınlanan Oyunlar'],['staff','Çalışanlar'],['finance','Finans'],['investors','Yatırımcılar'],['office','Ofis/Yükseltmeler'],['community','Topluluk'],['reports','Raporlar'],['settings','Ayarlar']];
const D={
 genres:['Bulmaca','Hyper Casual','Roguelike','Kart Oyunu','Idle','Simülasyon','Korku','Strateji','Mobil Casual','Hikâye Tabanlı','Platformer','Arcade'],
 themes:['Uzay','Şehir','Korku','Fantezi','Tarih','Bilim Kurgu','Okul','Hayatta Kalma','Yarış','İş Dünyası','Dedektiflik'],
 platforms:['Mobil','PC','Web'],audiences:['Çocuk','Genç','Casual','Hardcore','Geniş Kitle'],
 monet:['Reklam','Premium Satış','Freemium','Kozmetik Satış','Sezon Sistemi'],quality:['Düşük','Orta','Yüksek','Çok Yüksek'],risk:['Düşük','Orta','Yüksek'],aiIntensity:['Hız Odaklı','Dengeli','Kalite Odaklı'],
 stages:['Fikir Doğrulama','Tasarım','İçerik Üretimi','Kodlama','Test','Optimizasyon','Store Hazırlığı','Yayınlama'],
 ai:[['Temel AI',0,1,1,1],['Gelişmiş AI',90000,1.1,1.08,.95],['Prototip Uzmanı AI',130000,1.2,1.03,1.05],['İçerik Motoru AI',170000,1.15,1.13,.98],['Hata Avcısı AI',200000,.96,1.18,.8],['Monetization AI',220000,1.02,1.1,.94],['Viral Analiz AI',280000,1.08,1.16,.89],['AAA Stüdyo AI',410000,1.22,1.3,.83],['Otonom Geliştirme Sistemi',650000,1.38,1.45,.75]],
 roles:['Oyun Tasarımcısı','Prompt/AI Operatörü','Programcı','UI Tasarımcısı','QA Test Uzmanı','Veri Analisti','Topluluk Yöneticisi','Pazarlama Uzmanı','Reklam Uzmanı','İş Geliştirme','Finans Yöneticisi','İK Uzmanı','CTO','COO','Stüdyo Müdürü'],
 trends:['Idle furyası','Cozy yükselişi','Mobil puzzle patlaması','Retro dalga','AI temalı dönem','Web oyun canlanması','Low poly survival','Roguelike co-op rüzgarı','Korku yayıncı patlaması','Sosyal parti oyunları'],
 comments:['Oyun güzel ama çok reklam var.','Grafikler beklediğimden iyi.','Telefonumda kasıyor.','Son güncellemeden sonra bozuldu.','Bu fiyat için içerik az.','Baya bağımlılık yaptı.','Geliştirici ilgileniyor.','Pay-to-win hissi var.','DLC kaliteli.','Yama notları açıklayıcı.','Ödüllü reklam oranı dengeli.','Co-op modu şart.','Türkçe çeviriler komik olmuş.','Müzikler harika.','İlk başta sardı sonra tekrar etti.'],
 upgrades:[['Daha iyi PC',25000],['AI Sunucu Paketi',50000],['Test Cihazı Paketi',35000],['Hızlı İnternet',22000],['Küçük Ofis',120000],['Orta Ölçekli Stüdyo',220000],['Açık Ofis',280000],['Prestij Plazası',450000],['Motion Capture',320000],['Ses Kayıt Odası',260000],['Topluluk Operasyon Merkezi',140000],['Veri Analitik Merkezi',210000],['Kriz Yönetim Masası',175000],['Halka Arz Hazırlık',310000]],
 names:['Kod Atlası','Pixel Patron','Rüya Stüdyosu','Bug Avcısı','Viral Arena','Ofis Efsanesi','Neon Dedektif','Sonsuz Patch','Kritik Çöküş','Yapay Şehir','Karar Sim'],
 people:['Zeynep Yıldız','Mert Aksoy','Ece Kaya','Berke Yılmaz','Selin Arslan','Can Demirtaş','Defne Karaca','Emir Aydın','Duru Koç','Onur Güneş','Pelin Şahin','Yiğit Çelik','İlayda Öz','Kaan Polat','Mina Erdem','Alp Eren','Sude Uslu','Berkay Korkmaz','Aslı Bozkurt','Umut Tan'],
 investors:['Melek: 300.000₺ / %7 hisse','Fon: 1.200.000₺ / %18 hisse','VC: 2.800.000₺ / %26 hisse','Yayıncı: yeni oyunda %35 paylaşım','Tech şirketi: 9.500.000₺ satın alma','IP teklifi: 1.100.000₺','Reklam ortaklığı: CPM bonusu'],
 events:Array.from({length:110},(_,i)=>`Olay #${i+1}: ${['Platform algoritması değişti','Reklam gelirleri düştü','Bir yayıncı oyunu oynadı','Sosyal medyada viral oldun','Büyük bug krizi çıktı','Sunucu çöktü','Store öne çıkarma fırsatı','Rakipten yıldız çalışan ayrıldı','Telif itirazı geldi ama çözüldü','Topluluk seni ilgili geliştirici olarak sevdi'][i%10]}`)
};
let S=null,tab='dashboard',timer=null;
const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,p=a=>a[r(0,a.length-1)],cl=(v,a,b)=>Math.max(a,Math.min(b,v)),money=n=>`${Math.round(n).toLocaleString('tr-TR')}₺`;
function initState(name='Aras Interactive',diff='Dengeli',color='#52a5ff'){const m={Kolay:[300000,.85,1.2],Dengeli:[180000,1,1],Zor:[110000,1.25,.8]}[diff];return{
 meta:{name,diff,color,sound:false,notif:true},founder:'Aras Demir',time:{day:1,week:1,month:1,speed:1},
 finance:{cash:m[0],incomeM:0,expM:40000,net:0,value:m[0]*2,ad:0,sales:0,iap:0,deals:0,flow:[]},
 office:{level:'Ev Ofisi',up:[],rep:35,culture:45,vis:20,work:'Ofis'}, ai:0,
 market:{trend:p(D.trends),competition:m[1],viral:.04,adEff:m[2],commission:.3},
 staff:[{name:'Aras Demir',role:'Kurucu',salary:0,mot:76,loy:88,prod:84,cre:86,tech:84,stress:18,quit:2}],
 projects:[],games:[],investQ:[],tasks:['İlk oyununu yayınla','1000 indirme','İlk çalışanını işe al','Aylık 10.000 gelir','İlk yatırım teklifini al'].map(t=>({t,d:false})),badges:[],
 notif:['Kariyer başladı. Aras Demir ev ofiste.'],events:[],analytics:{users:0,revD:0}
};}
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
function load(){try{return JSON.parse(localStorage.getItem(KEY));}catch{return null;}}
function modal(title,html,mount){const m=document.getElementById('modal');m.innerHTML=`<div class='modal-bg'><div class='modal'><h3>${title}</h3>${html}<div style='margin-top:10px'><button id='closeM'>Kapat</button></div></div></div>`;document.getElementById('closeM').onclick=()=>m.innerHTML='';if(mount)mount(m);}
function info(k){if(k==='how')modal('Nasıl Oynanır',`<ol><li>Yeni Kariyer başlat.</li><li>Yeni Oyun Oluştur ekranından proje aç.</li><li>Aktif Projelerde kararlarla riski yönet.</li><li>Yayınlanan oyunun metriklerini izle.</li><li>Çalışan, ofis, AI, yatırım kararlarıyla büyü.</li></ol>`);if(k==='about')modal('Hakkında',`<p>AI Game Studio Tycoon Türkiye tek HTML dosyada çalışan tam oynanabilir yönetim simülasyonu.</p>`)}
function start(){document.getElementById('start').classList.remove('active');document.getElementById('game').classList.add('active');drawSide();bind();render();if(timer)clearInterval(timer);timer=setInterval(tick,1000);setInterval(save,10000)}
function bind(){document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{S.time.speed=+b.dataset.sp;document.querySelectorAll('[data-sp]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
 document.getElementById('save').onclick=()=>{save();push('Manuel kayıt alındı.')};document.getElementById('reset').onclick=()=>{if(confirm('Sıfırdan başlatılsın mı?')){localStorage.removeItem(KEY);location.reload();}}}
function drawSide(){const el=document.getElementById('side');el.innerHTML=TABS.map(([k,v])=>`<button class='tab ${tab===k?'active':''}' data-t='${k}'>${v}</button>`).join('');el.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;drawSide();render()})}
function push(t){S.notif.unshift(t);if(S.notif.length>35)S.notif.pop()}
function tick(){if(S.time.speed===0)return;for(let i=0;i<S.time.speed;i++)day();render()}
function day(){S.time.day++;if(S.time.day%7===0)S.time.week++;if(S.time.day%30===0){S.time.month++;month();}
 S.projects.forEach(pr=>{if(pr.done)return;const ai=D.ai[S.ai],team=S.staff.reduce((a,x)=>a+x.prod*.01,.85);const mode=pr.aiI==='Hız Odaklı'?1.2:pr.aiI==='Kalite Odaklı'?.86:1;pr.progress+=ai[2]*team*mode;if(Math.random()<.09)projectEvent(pr);if(pr.progress>=100){pr.stage++;pr.progress=0;if(pr.stage>=D.stages.length)publish(pr)}});
 S.games.forEach(g=>{const q=(g.h.fun+g.h.tech+g.h.gfx+g.h.innov)/4;const ret=cl(g.h.ret*(1-g.m.churn/100),10,95);g.m.dau=Math.max(0,Math.round(g.m.wau*(ret/100)+r(-80,120)));g.m.mau=Math.round(g.m.dau*r(16,24));const rev=Math.max(0,Math.round((g.m.dau*(q/100)*(g.mon==='Reklam'?1.25:.65+ (['Freemium','Kozmetik Satış','Sezon Sistemi'].includes(g.mon)?1.2:.45))*S.market.adEff)/7));g.m.revD=rev;g.m.revT+=rev;g.m.down+=Math.max(0,Math.round(g.m.dau*.34+r(-20,50)));g.m.rating=cl(g.m.rating+((q>72)?.01:-.015)-g.m.crash/260,1.8,4.9);g.m.churn=cl(g.m.churn+r(-2,2)+(g.ad>65?2:-1),5,55);g.m.comSat=cl(g.m.comSat+r(-2,2)+(g.m.rating>4.2?1:-1),15,98);g.m.wau=Math.max(0,g.m.wau+r(-200,280));S.finance.incomeM+=rev;S.finance.ad+=Math.round(rev*(g.mon==='Reklam'?.55:.2));S.finance.sales+=Math.round(rev*(g.mon==='Premium Satış'?.7:.18));S.finance.iap+=Math.round(rev*(['Freemium','Kozmetik Satış','Sezon Sistemi'].includes(g.mon)?.5:.12));});
 S.analytics.users=S.games.reduce((a,g)=>a+g.m.dau,0);S.analytics.revD=S.games.reduce((a,g)=>a+g.m.revD,0);
 if(Math.random()<.06){const e=p(D.events);S.events.unshift(e);if(S.events.length>120)S.events.pop();if(e.includes('viral'))S.market.viral+=.01;if(e.includes('Reklam gelirleri düştü'))S.market.adEff*=.96;if(e.includes('öne çıkarma'))S.office.vis+=3;push(e)}
 if(S.finance.cash>420000&&Math.random()<.04)S.investQ.unshift({txt:p(D.investors),day:S.time.day});
 if(S.staff.length>1&&Math.random()<.1){const x=p(S.staff.slice(1));const ev=p(['zam istedi','rakipten teklif aldı','fazla mesai nedeniyle mutsuz','harika fikir getirdi','büyük hata yaptı','işten ayrılma sinyali verdi']);push(`${x.name} ${ev}.`);if(ev.includes('harika fikir'))S.office.rep+=1;if(ev.includes('büyük hata'))x.stress+=8;if(ev.includes('ayrılma'))x.quit+=5}
 S.finance.value=Math.max(50000,S.finance.cash+S.games.reduce((a,g)=>a+g.m.revT*1.4+g.m.wau*2,0)+S.office.rep*5000);
 S.tasks.forEach(t=>{if(t.d)return;if(t.t==='İlk oyununu yayınla'&&S.games.length)t.d=true;if(t.t==='1000 indirme'&&S.games.some(g=>g.m.down>1000))t.d=true;if(t.t==='İlk çalışanını işe al'&&S.staff.length>1)t.d=true;if(t.t==='Aylık 10.000 gelir'&&S.analytics.revD>330)t.d=true;if(t.t==='İlk yatırım teklifini al'&&S.investQ.length)t.d=true});
 if(S.tasks[0].d&&!S.badges.includes('İlk Yayın'))S.badges.push('İlk Yayın');if(S.tasks[1].d&&!S.badges.includes('1000 İndirme'))S.badges.push('1000 İndirme');
}
function month(){const sal=S.staff.reduce((a,e)=>a+e.salary,0),off=15000+S.office.up.length*2200,server=Math.max(8000,S.games.reduce((a,g)=>a+g.h.server*80,0)),tax=Math.max(0,S.finance.incomeM)*.16,exp=sal+off+server+tax;S.finance.expM=exp;S.finance.net=S.finance.incomeM-exp;S.finance.cash+=S.finance.net;S.finance.flow.push({m:S.time.month,c:S.finance.cash,i:S.finance.incomeM});if(S.finance.flow.length>18)S.finance.flow.shift();S.finance.incomeM=0;S.market.trend=p(D.trends);if(S.finance.cash<0)push('Nakit eksiye düştü, iflas riski arttı!')}
function projectEvent(pr){const evs=[['AI beklenenden iyi iş çıkardı',()=>{pr.tech+=5;pr.bug-=4}],['AI tekrar eden içerik üretti',()=>pr.innov-=6],['Beklenenden fazla bug geldi',()=>pr.bug+=7],['Asset stili tutarsız',()=>pr.gfx-=5],['Ana döngü sıkıcı kaldı',()=>pr.fun-=5],['Test kullanıcıları sevdi',()=>{pr.fun+=6;pr.ret+=5}],['Sunucu maliyet tahmini yükseldi',()=>pr.server+=8],['Store açıklaması zayıf',()=>pr.comment-=6],['Son gün kritik bug çıktı',()=>pr.bug+=10],['Reklam SDK çakıştı',()=>{pr.bug+=5;pr.monet-=4}],['Telif riski benzerlik',()=>pr.innov-=8],['Topluluk sanat stilini sevdi',()=>{pr.gfx+=8;pr.viral+=4}]];const [t,f]=p(evs);f();push(`${pr.name}: ${t}`)}
function publish(pr){pr.done=true;const g={id:crypto.randomUUID(),name:pr.name,genre:pr.genre,theme:pr.theme,platform:pr.platform,aud:pr.aud,mon:pr.mon,launch:S.time.day,ad:r(30,66),h:{fun:pr.fun,tech:pr.tech,gfx:pr.gfx,innov:pr.innov,add:pr.add,bug:pr.bug,server:pr.server,ret:pr.ret,viral:pr.viral,comment:pr.comment,monet:pr.monet},updates:['v1.0 yayınlandı'],m:{first:r(300,2200),wau:r(500,3800),mau:r(3000,19000),session:r(8,31),rating:+(r(28,46)/10).toFixed(1),comments:r(30,420),crash:r(1,14),refund:pr.mon==='Premium Satış'?r(1,9):0,arpu:+(Math.random()*2.4+.4).toFixed(2),arpdau:+(Math.random()*2+.2).toFixed(2),revD:0,revT:0,viral:r(1,32),markEff:r(25,93),churn:r(8,38),comSat:r(40,85),dau:r(200,1200),down:r(600,5000)}};S.games.unshift(g);push(`${g.name} başarıyla yayınlandı!`)}
function analysis(pr){const out=[];const avg=(pr.fun+pr.tech+pr.gfx+pr.innov)/4;if(avg>74)out.push('Potansiyeli yüksek');if(pr.bug>58)out.push('Teknik riski var');if(pr.monet>75)out.push('Gelir modeli agresif olabilir');if(pr.ret<52&&pr.fun>65)out.push('İlk hafta severler, sonra düşebilir');if(pr.ad>60)out.push('Reklam yoğunluğu iyi ayarlanmalı');if(pr.aud==='Hardcore'||pr.genre==='Roguelike')out.push('Niş kitleye hitap ediyor');return out}
function newProject(fd){const ai=D.ai[S.ai],budget=+fd.get('budget'),risk=fd.get('risk')==='Yüksek'?12:fd.get('risk')==='Düşük'?-5:0,qt={Düşük:45,Orta:58,Yüksek:72,'Çok Yüksek':82}[fd.get('quality')],base=cl(qt+r(-10,10)+(budget/20000)+(ai[3]*8),20,98);
 const pr={id:crypto.randomUUID(),done:false,stage:0,progress:0,name:fd.get('name')||p(D.names),genre:fd.get('genre'),theme:fd.get('theme'),platform:fd.get('platform'),aud:fd.get('audience'),mon:fd.get('monet'),budget,deadline:+fd.get('deadline'),quality:fd.get('quality'),risk:fd.get('risk'),aiI:fd.get('aiIntensity'),fun:cl(base+r(-8,8),20,99),tech:cl(base+r(-8,8),20,99),gfx:cl(base+r(-10,10),20,99),innov:cl(base+r(-12,12),20,99),add:cl(base+r(-6,6),20,99),bug:cl(45+risk+r(-10,10)/ai[4],5,95),server:cl(r(20,80),5,95),ret:cl(base+r(-15,8),10,95),viral:cl(base+r(-20,20),5,99),comment:cl(base+r(-15,15),10,95),monet:cl(base+r(-15,16),15,95),ad:r(35,75)};
 S.projects.unshift(pr);S.finance.cash-=budget;push(pr.name+' projesi başlatıldı.')}
function render(){if(!S)return;document.getElementById('company').textContent=`${S.meta.name} • ${S.founder}`;document.getElementById('date').textContent=`${S.time.day}. Gün | ${S.time.week}. Hafta | ${S.time.month}. Ay`;document.getElementById('strip').innerHTML=[`Nakit ${money(S.finance.cash)}`,`Şirket Değeri ${money(S.finance.value)}`,`Kullanıcı ${S.analytics.users.toLocaleString('tr-TR')}`,`Trend ${S.market.trend}`,`AI ${D.ai[S.ai][0]}`].map(x=>`<span class='pill'>${x}</span>`).join('');
 const m=document.getElementById('main');({dashboard:rDash,new:rNew,projects:rProjects,games:rGames,staff:rStaff,finance:rFin,investors:rInv,office:rOffice,community:rCom,reports:rRep,settings:rSet}[tab])(m)}
function rDash(m){m.innerHTML=`<div class='grid'><div class='card'><h3>Stüdyo Durumu</h3><div>İtibar <b>${S.office.rep}</b></div><div>Kültür <b>${S.office.culture}</b></div><div>Görünürlük <b>${S.office.vis}</b></div><div>Çalışma Modeli <b>${S.office.work}</b></div></div><div class='card'><h3>Canlı KPI</h3><div>Günlük Gelir</div><div class='kpi'>${money(S.analytics.revD)}</div><div>Aktif Proje ${S.projects.filter(x=>!x.done).length}</div><div>Yayınlanan Oyun ${S.games.length}</div></div><div class='card'><h3>Görevler</h3>${S.tasks.map(t=>`<div>${t.d?'✅':'⬜'} ${t.t}</div>`).join('')}</div><div class='card'><h3>Rozetler</h3>${S.badges.length?S.badges.map(b=>`<span class='tag'>${b}</span>`).join(' '):'Henüz yok.'}</div></div><div class='card' style='margin-top:10px'><h3>Bildirim Akışı</h3>${S.notif.slice(0,8).map(n=>`<div class='notif'>${n}</div>`).join('')}</div>`}
function rNew(m){m.innerHTML=`<div class='card'><h3>AI Oyun Üretim Paneli</h3><form id='f' class='f2'>
<div class='f'><label>Oyun Adı</label><input name='name' placeholder='${p(D.names)}'></div><div class='f'><label>Tür</label><select name='genre'>${D.genres.map(x=>`<option>${x}</option>`)}</select></div>
<div class='f'><label>Tema</label><select name='theme'>${D.themes.map(x=>`<option>${x}</option>`)}</select></div><div class='f'><label>Platform</label><select name='platform'>${D.platforms.map(x=>`<option>${x}</option>`)}</select></div>
<div class='f'><label>Hedef Kitle</label><select name='audience'>${D.audiences.map(x=>`<option>${x}</option>`)}</select></div><div class='f'><label>Gelir Modeli</label><select name='monet'>${D.monet.map(x=>`<option>${x}</option>`)}</select></div>
<div class='f'><label>Bütçe</label><input type='number' name='budget' value='45000' min='10000' step='5000'></div><div class='f'><label>Teslim (gün)</label><input type='number' name='deadline' value='60' min='10'></div>
<div class='f'><label>Kalite Hedefi</label><select name='quality'>${D.quality.map(x=>`<option>${x}</option>`)}</select></div><div class='f'><label>Risk Seviyesi</label><select name='risk'>${D.risk.map(x=>`<option>${x}</option>`)}</select></div>
<div class='f'><label>AI Yoğunluğu</label><select name='aiIntensity'>${D.aiIntensity.map(x=>`<option>${x}</option>`)}</select></div></form>
<div class='rows'><button id='an'>AI Analiz</button><button id='go'>Projeyi Başlat</button></div><div id='anBox' class='small' style='margin-top:8px'></div></div>`;
const f=m.querySelector('#f');m.querySelector('#an').onclick=()=>{const fd=new FormData(f),ghost={fun:r(40,90),tech:r(40,90),gfx:r(35,92),innov:r(30,90),ret:r(30,90),bug:r(10,80),monet:r(25,92),ad:r(30,80),aud:fd.get('audience'),genre:fd.get('genre')};m.querySelector('#anBox').innerHTML=analysis(ghost).map(x=>'• '+x).join('<br>')||'Analiz: Ortalama risk / potansiyel'};
m.querySelector('#go').onclick=()=>{const fd=new FormData(f);if(+fd.get('budget')>S.finance.cash*.8)return alert('Bu bütçe şu an çok yüksek.');newProject(fd);render();};}
function rProjects(m){const a=S.projects.filter(x=>!x.done);m.innerHTML=`<div class='card'><h3>Aktif Projeler</h3>${a.length?'':'Aktif proje yok.'}</div>`;const c=m.firstElementChild;a.forEach(pr=>c.innerHTML+=`<div class='card' style='margin-top:8px'><h4>${pr.name}</h4><div>${D.stages[pr.stage]} • %${pr.progress.toFixed(1)}</div><div class='small'>${analysis(pr).join(' | ')}</div><div class='rows' style='margin-top:6px'><button data-a='b' data-id='${pr.id}'>Ek Bütçe</button><button data-a='e' data-id='${pr.id}'>Süreyi Uzat</button><button data-a='s' data-id='${pr.id}'>Soft Launch</button><button data-a='d' data-id='${pr.id}'>Ertele</button></div></div>`);
 c.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>{const pr=S.projects.find(x=>x.id===b.dataset.id);if(!pr)return;const a=b.dataset.a;if(a==='b'){S.finance.cash-=15000;pr.tech+=3;pr.bug-=2}if(a==='e'){pr.deadline+=7;pr.tech+=2}if(a==='s'){pr.viral+=3;pr.comment+=2}if(a==='d'){pr.deadline+=14;pr.bug-=4}render()})}
function rGames(m){m.innerHTML=`<div class='card'><h3>Yayınlanan Oyunlar</h3>${S.games.length?`<table><thead><tr><th>Oyun</th><th>Puan</th><th>Aktif</th><th>İndirme</th><th>Gelir</th><th></th></tr></thead><tbody>${S.games.map(g=>`<tr><td>${g.name}<div class='small'>${g.genre}/${g.theme}</div></td><td>${g.m.rating.toFixed(1)}</td><td>${g.m.dau.toLocaleString('tr-TR')}</td><td>${g.m.down.toLocaleString('tr-TR')}</td><td>${money(g.m.revT)}</td><td><button data-g='${g.id}'>Detay</button></td></tr>`).join('')}</tbody></table>`:'Henüz oyun yok.'}</div>`;
 m.querySelectorAll('button[data-g]').forEach(b=>b.onclick=()=>{const g=S.games.find(x=>x.id===b.dataset.g);const rival=p(['PixelNova','Anatolia Labs','Kuzey Oyun']);modal(g.name+' Detay',`<div class='grid'><div class='card'><h4>Genel</h4><div>Tür ${g.genre}</div><div>Tema ${g.theme}</div><div>Çıkış Gün ${g.launch}</div><div>Platform ${g.platform}</div></div><div class='card'><h4>Metrikler</h4><div>Puan ${g.m.rating.toFixed(1)}</div><div>Aktif ${g.m.dau.toLocaleString('tr-TR')}</div><div>İndirme ${g.m.down.toLocaleString('tr-TR')}</div><div>Gelir ${money(g.m.revT)}</div></div><div class='card'><h4>Kalite & Risk</h4><div>Hata ${g.h.bug}</div><div>Reklam Yoğunluğu ${g.ad}</div><div>Memnuniyet ${g.m.comSat}</div><div>Store görünürlük ${S.office.vis}</div></div><div class='card'><h4>Rakip</h4><div>${rival}</div><div>Viral momentum ${g.m.viral}</div></div></div><h4>Güncellemeler</h4><ul>${g.updates.map(u=>`<li>${u}</li>`).join('')}</ul><div class='rows'><button id='p1'>Hızlı yama</button><button id='p2'>Yeni içerik</button><button id='p3'>Reklam azalt</button></div>`,mm=>{mm.querySelector('#p1').onclick=()=>{g.m.crash=cl(g.m.crash-2,0,100);g.updates.push(`Gün ${S.time.day}: hızlı yama`);render()};mm.querySelector('#p2').onclick=()=>{g.m.comSat+=4;g.m.dau+=250;g.updates.push(`Gün ${S.time.day}: içerik paketi`);render()};mm.querySelector('#p3').onclick=()=>{g.ad=cl(g.ad-10,0,100);g.m.rating=cl(g.m.rating+.1,1,5);render()};})})}
function rStaff(m){m.innerHTML=`<div class='card'><h3>Çalışanlar</h3><div class='rows'><select id='role'>${D.roles.map(x=>`<option>${x}</option>`)}</select><button id='hire'>İşe Al</button></div><table><thead><tr><th>İsim</th><th>Rol</th><th>Maaş</th><th>Motivasyon</th><th>Stres</th><th>Risk</th><th>Karar</th></tr></thead><tbody>${S.staff.map((e,i)=>`<tr><td>${e.name}</td><td>${e.role}</td><td>${money(e.salary)}</td><td>${e.mot}</td><td>${e.stress}</td><td>${e.quit}%</td><td>${i===0?'Kurucu':`<button data-i='${i}' data-a='raise'>Zam</button><button data-i='${i}' data-a='bonus'>Prim</button><button data-i='${i}' data-a='warn'>Uyar</button><button data-i='${i}' data-a='fire'>Çıkar</button>`}</td></tr>`).join('')}</tbody></table></div>`;
 m.querySelector('#hire').onclick=()=>{const role=m.querySelector('#role').value,name=p(D.people),salary=r(18000,55000);if(S.finance.cash<salary*2)return alert('Yetersiz nakit.');S.staff.push({name,role,salary,mot:r(42,88),loy:r(35,90),prod:r(35,92),cre:r(30,90),tech:r(32,93),stress:r(12,70),quit:r(3,19)});push(`${name} (${role}) işe alındı.`);render()};
 m.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{const e=S.staff[+b.dataset.i],a=b.dataset.a;if(a==='raise'){e.salary*=1.12;e.mot+=8;S.finance.cash-=Math.round(e.salary*.5)}if(a==='bonus'){e.mot+=6;e.loy+=4;S.finance.cash-=12000}if(a==='warn'){e.mot-=8;e.quit+=7}if(a==='fire'){S.staff.splice(+b.dataset.i,1)}render()})}
function rFin(m){m.innerHTML=`<div class='grid'><div class='card'><h3>Finans Özet</h3><div>Günlük Gelir ${money(S.analytics.revD)}</div><div>Aylık Gelir ${money(S.finance.incomeM)}</div><div>Net Kâr ${money(S.finance.net)}</div><div>Sabit Gider ${money(S.finance.expM)}</div></div><div class='card'><h3>Gelir Kırılımı</h3><div>Reklam ${money(S.finance.ad)}</div><div>Satış ${money(S.finance.sales)}</div><div>IAP ${money(S.finance.iap)}</div><div>Anlaşmalar ${money(S.finance.deals)}</div></div><div class='card'><h3>Maliyetler</h3><div>Personel ${money(S.staff.reduce((a,e)=>a+e.salary,0))}</div><div>Sunucu ${money(S.games.reduce((a,g)=>a+g.h.server*80,0))}</div><div>Komisyon/Vergi %16</div></div></div><div class='card' style='margin-top:10px'><h3>Nakit Akışı</h3><canvas id='flow' width='800' height='180'></canvas></div>`;
 const cv=m.querySelector('#flow'),ctx=cv.getContext('2d'),arr=S.finance.flow;ctx.clearRect(0,0,cv.width,cv.height);ctx.strokeStyle='#2b4269';for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(0,20+i*26);ctx.lineTo(cv.width,20+i*26);ctx.stroke()}if(arr.length>1){const min=Math.min(...arr.map(x=>x.c)),max=Math.max(...arr.map(x=>x.c));ctx.strokeStyle='#52a5ff';ctx.lineWidth=2;ctx.beginPath();arr.forEach((pt,i)=>{const x=30+i*((cv.width-60)/(arr.length-1)),y=160-((pt.c-min)/(max-min||1))*120;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();}}
function rInv(m){m.innerHTML=`<div class='card'><h3>Yatırımcılar / Anlaşmalar</h3>${S.investQ.length?S.investQ.slice(0,8).map((o,i)=>`<div class='card' style='margin-top:8px'><div>${o.txt}</div><div class='rows'><button data-i='${i}' data-a='ac'>Kabul Et</button><button data-i='${i}' data-a='ne'>Pazarlık</button><button data-i='${i}' data-a='re'>Reddet</button></div></div>`).join(''):'Şimdilik teklif yok.'}</div>`;
 m.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(!S.investQ[i])return;const a=b.dataset.a;if(a==='ac'){const g=r(180000,1600000);S.finance.cash+=g;S.finance.deals+=g;S.office.rep+=3;push(`Yatırım kabul edildi +${money(g)}`)}if(a==='ne'){const g=r(120000,900000);S.finance.cash+=g;S.finance.deals+=g;S.office.rep+=1;push(`Pazarlıkla anlaşma +${money(g)}`)}if(a==='re'){S.office.rep+=1;push('Teklif reddedildi, bağımsız büyüme sürüyor.')}S.investQ.splice(i,1);render()})}
function rOffice(m){const ai=D.ai[S.ai];m.innerHTML=`<div class='grid'><div class='card'><h3>Ofis</h3><div>Seviye ${S.office.level}</div><div>Yükseltme ${S.office.up.length}</div><div>Çalışma modeli <select id='wm'><option ${S.office.work==='Ofis'?'selected':''}>Ofis</option><option ${S.office.work==='Hibrit'?'selected':''}>Hibrit</option><option ${S.office.work==='Remote'?'selected':''}>Remote</option></select></div></div><div class='card'><h3>AI Altyapısı</h3><div>Aktif <b>${ai[0]}</b></div><div>Hız ${ai[2]}</div><div>Kalite ${ai[3]}</div><div>Bug çarpanı ${ai[4]}</div><button id='upAI'>AI Seviyesini Yükselt (${money(D.ai[S.ai+1]?.[1]||0)})</button></div><div class='card'><h3>Yükseltmeler</h3>${D.upgrades.map(([n,c])=>`<div class='rows'><span>${n} - ${money(c)}</span><button data-u='${n}'>Al</button></div>`).join('')}</div></div>`;
 m.querySelector('#wm').onchange=e=>S.office.work=e.target.value;m.querySelector('#upAI').onclick=()=>{const nx=D.ai[S.ai+1];if(!nx)return alert('En yüksek seviye');if(S.finance.cash<nx[1])return alert('Yetersiz nakit');S.finance.cash-=nx[1];S.ai++;push('AI yükseltildi: '+nx[0]);render()};
 m.querySelectorAll('button[data-u]').forEach(b=>b.onclick=()=>{const up=D.upgrades.find(x=>x[0]===b.dataset.u);if(S.office.up.includes(up[0]))return;if(S.finance.cash<up[1])return alert('Bütçe yetersiz');S.finance.cash-=up[1];S.office.up.push(up[0]);S.office.rep+=2;render()})}
function rCom(m){const g=S.games[0],cs=Array.from({length:12},()=>p(D.comments));m.innerHTML=`<div class='card'><h3>Topluluk / Geri Bildirim</h3>${g?`Odak oyun: <b>${g.name}</b>`:'Henüz oyun yayınlanmadı.'}${cs.map(c=>`<div class='notif'>"${c}"</div>`).join('')}<div class='rows'><button id='q'>Hızlı yama</button><button id='ad'>Reklam azalt</button><button id='pr'>Fiyat düşür</button><button id='ct'>Yeni içerik</button><button id='inf'>Influencer</button></div></div>`;
 const act=f=>{if(!g)return;f();render()};m.querySelector('#q').onclick=()=>act(()=>{g.m.crash-=1.8;g.m.rating+=.08});m.querySelector('#ad').onclick=()=>act(()=>{g.ad-=8;g.m.rating+=.1;g.m.revD*=.95});m.querySelector('#pr').onclick=()=>act(()=>{g.m.refund-=.5;g.m.down+=200});m.querySelector('#ct').onclick=()=>act(()=>{g.m.comSat+=4;g.m.dau+=220});m.querySelector('#inf').onclick=()=>act(()=>{S.finance.cash-=30000;g.m.viral+=5;g.m.down+=900})}
function rRep(m){const best=[...S.games].sort((a,b)=>b.m.revT-a.m.revT)[0],worst=[...S.games].sort((a,b)=>a.m.revT-b.m.revT)[0];m.innerHTML=`<div class='grid'><div class='card'><h3>Pazar/Trend</h3><div>Trend ${S.market.trend}</div><div>Rekabet ${S.market.competition.toFixed(2)}</div><div>Viral İhtimal %${Math.round(S.market.viral*100)}</div></div><div class='card'><h3>Performans</h3><div>En iyi ${best?best.name:'-'}</div><div>En kötü ${worst?worst.name:'-'}</div><div>Toplam kullanıcı ${S.analytics.users.toLocaleString('tr-TR')}</div></div><div class='card'><h3>Kriz Havuzu</h3>${['Sunucu Çökmesi','Kritik Bug Krizi','Telif İtirazı','PR Krizi','İade Dalgası','Store görünürlük kaybı'].map(x=>`<div>• ${x}</div>`).join('')}</div><div class='card'><h3>Olay Günlüğü</h3>${S.events.slice(0,8).map(e=>`<div>${e}</div>`).join('')}</div></div>`}
function rSet(m){m.innerHTML=`<div class='card'><h3>Ayarlar</h3><div class='rows'><button id='snd'>Ses ${S.meta.sound?'Kapat':'Aç'}</button><button id='not'>Bildirim ${S.meta.notif?'Kapat':'Aç'}</button><button id='sv'>Kaydet</button><button id='ld'>Yükle</button></div><p class='small'>Oyun otomatik kaydedilir. Kayıt anahtarı: ${KEY}</p></div>`;
 m.querySelector('#snd').onclick=()=>{S.meta.sound=!S.meta.sound;render()};m.querySelector('#not').onclick=()=>{S.meta.notif=!S.meta.notif;render()};m.querySelector('#sv').onclick=()=>{save();push('Ayarlar ekranından kayıt alındı.');render()};m.querySelector('#ld').onclick=()=>{const x=load();if(x){S=x;render()}}}

// başlangıç butonları
newBtn.onclick=()=>modal('Yeni Kariyer',`<div class='f'><label>Şirket Adı</label><input id='n' value='Aras Interactive'></div><div class='f'><label>Logo Rengi</label><input id='c' type='color' value='#52a5ff'></div><div class='f'><label>Zorluk</label><select id='d'><option>Kolay</option><option selected>Dengeli</option><option>Zor</option></select></div><button id='ok'>Kariyeri Başlat</button>`,m=>m.querySelector('#ok').onclick=()=>{S=initState(m.querySelector('#n').value,m.querySelector('#d').value,m.querySelector('#c').value);document.getElementById('modal').innerHTML='';start()});
loadBtn.onclick=()=>{const x=load();if(!x)return alert('Kayıt bulunamadı');S=x;start()};
</script>
</body>
</html>
